name: Collecte AO quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  collecte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/collecteur

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lancer le collecteur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node collect.mjs

  telechargement:
    runs-on: ubuntu-latest
    needs: collecte # attend que collecte.mjs finisse avant de lancer les téléchargements
    defaults:
      run:
        working-directory: scripts/collecteur

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lancer le téléchargement des dossiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node download-dossiers.mjs