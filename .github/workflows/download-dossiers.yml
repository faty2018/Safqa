name: Téléchargement des dossiers DCE

on:
  schedule:
    - cron: "30 6 * * *"  # 1er lot, juste après la collecte
    - cron: "0 12 * * *"  # 2e lot
    - cron: "0 18 * * *"  # 3e lot
    - cron: "0 2 * * *"  # 4e lot
  workflow_dispatch:

jobs:
  telechargement:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # échoue proprement bien avant la limite de 6h de GitHub
    defaults:
      run:
        working-directory: scripts/collecteur

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lancer le téléchargement des dossiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node download-dossiers.mjs